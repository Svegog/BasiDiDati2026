{% extends "base.html" %}
{% block title %}{{ 'Modifica' if cliente else 'Nuovo' }} Cliente{% endblock %}
{% block content %}

<h2>{{ 'Modifica Cliente' if cliente else 'Nuovo Cliente' }}</h2>

<form method="POST" class="mt-3">
    <!-- inserisci qui i campi del form secondo le colonne del tuo schema -->
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control"
               value="{{ cliente['nome'] if cliente else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Cognome</label>
        <input type="text" name="cognome" class="form-control"
               value="{{ cliente['cognome'] if cliente else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Telefono</label>
        <input type="text" name="telefono" class="form-control"
               value="{{ cliente['telefono'] if cliente else '' }}">
    </div>

    <button type="submit" class="btn btn-primary">Salva</button>
    <a href="{{ url_for('lista_clienti') }}" class="btn btn-secondary">Annulla</a>
</form>

{% endblock %}
