<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestionale Bagno{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<!-- ============================================================
     BARRA DI NAVIGAZIONE
     Per modificare il nome, i colori o i link: agisci qui.
     Per cambiare colore sfondo: cambia "bg-primary" (es. bg-dark, bg-info)
     ============================================================ -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🏖️ Gestionale Bagno</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{{ url_for('index') }}">Home</a>
            <a class="nav-link" href="{{ url_for('lista_clienti') }}">Clienti</a>
            <a class="nav-link" href="{{ url_for('lista_ombrelloni') }}">Ombrelloni</a>
            <a class="nav-link" href="{{ url_for('lista_prenotazioni') }}">Prenotazioni</a>
            <!-- Aggiungi qui altri link verso le tue pagine/entità -->
        </div>
    </div>
</nav>

<div class="container">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-success">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted mt-5 mb-3">
    <small>Progetto Basi di Dati &mdash; Gestionale Bagno Spiaggia</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
