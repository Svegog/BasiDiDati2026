{% extends "base.html" %}
{% block title %}{% if cliente %}Modifica{% else %}Nuovo{% endif %} Cliente{% endblock %}
{% block content %}

<h2>{% if cliente %}Modifica Cliente{% else %}Nuovo Cliente{% endif %}</h2>

<form method="POST" class="mt-3">
    {% csrf_token %}
    <!-- inserisci qui i campi del form secondo le colonne del tuo schema -->
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control"
               value="{% if cliente %}{{ cliente.nome }}{% endif %}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Cognome</label>
        <input type="text" name="cognome" class="form-control"
               value="{% if cliente %}{{ cliente.cognome }}{% endif %}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Telefono</label>
        <input type="text" name="telefono" class="form-control"
               value="{% if cliente %}{{ cliente.telefono }}{% endif %}">
    </div>

    <button type="submit" class="btn btn-primary">Salva</button>
    <a href="{% url 'lista_clienti' %}" class="btn btn-secondary">Annulla</a>
</form>

{% endblock %}
