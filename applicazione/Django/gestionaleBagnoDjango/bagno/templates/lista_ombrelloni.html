{% extends "base.html" %}
{% block title %}Ombrelloni{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Elenco Ombrelloni</h2>
    <!-- aggiungi qui eventuale bottone "+ Nuovo Ombrellone" seguendo lo stesso schema di Cliente -->
</div>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            <!-- inserisci qui i nomi delle colonne secondo il tuo schema -->
            <th>Numero</th>
            <th>Fila</th>
            <th>Stato</th>
        </tr>
    </thead>
    <tbody>
        {% for o in ombrelloni %}
        <tr>
            <!-- inserisci qui le celle corrispondenti -->
            <td>{{ o.numero }}</td>
            <td>{{ o.fila }}</td>
            <td>{{ o.stato }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
