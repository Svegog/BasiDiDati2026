{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="turni-grid-container">

    <aside class="pannello-sinistro menu-laterale">
        <h2>Area Turni</h2>

        <div class="gruppo-comandi">
            <h3>Servizi</h3>
            <button class="toggle-btn" data-url="{% url 'registra_dipendente' %}" data-target="#pannello-form">Nuovo Dipendente</button>
            <button class="toggle-btn" data-url="{% url 'aggiungi_turno' %}" data-target="#pannello-form">Assegna Turno</button>
        </div>

        <div class="gruppo-comandi">
            <h3>Controlli</h3>
            <button class="toggle-btn" data-url="{% url 'visualizza_dipendenti_turno' %}" data-target="#pannello-form">Dipendenti in Turno</button>
        </div>

        <div class="navigazione-ritorno">
            <a href="{% url 'dashboard' %}" class="btn-dashboard">Torna alla Dashboard</a>
        </div>
    </aside>

    <section id="pannello-form" class="pannello-operativo">
        <div class="stato-vuoto">
            <img src="{% static 'images/logo.png' %}" alt="Logo Stabilimento">
            <p>Seleziona un'operazione dal menu <b>Servizi</b> o <b>Ordini</b> per iniziare.</p>
        </div>
    </section>

    <section id="risultati-query" class="pannello-risultati"></section>
</div>

<script src="{% static 'js/lateral-toggle.js' %}"></script>
{% endblock %}
