{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="spiaggia-grid-container">

    <aside class="pannello-sinistro menu-laterale">
        <h2>Area Spiaggia</h2>

        <div class="gruppo-comandi">
            <h3>Servizi</h3>
            <button class="toggle-btn" data-url="{% url 'inserisci_cliente' %}" data-target="#pannello-form">Inserimento Cliente</button>
            <button class="toggle-btn" data-url="{% url 'inserisci_prenotazione' %}" data-target="#pannello-form">Prenotazione</button>
            <button class="toggle-btn" data-url="{% url 'inserisci_abbonamento' %}" data-target="#pannello-form">Abbonamento</button>
            <button class="toggle-btn" data-url="{% url 'inserisci_noleggio' %}" data-target="#pannello-form">Noleggio Lettino</button>
            <button class="toggle-btn" data-url="{% url 'modifica_tariffa_lettini' %}" data-target="#pannello-form">Modifica Prezzo Lettini</button>
            <button class="toggle-btn" data-url="{% url 'modifica_prezzi_fila' %}" data-target="#pannello-form">Modifica Prezzo File</button>
            <button class="toggle-btn" data-url="{% url 'conferma_pagamento_spiaggia' %}" data-target="#pannello-form">Aggiorna Stato Pagamento</button>
        </div>

        <div class="gruppo-comandi">
            <h3>Controlli</h3>
            <button class="toggle-btn" data-url="{% url 'storico_cliente' %}" data-target="#risultati-query">Storico Cliente</button>
            <button class="toggle-btn" data-url="{% url 'verifica_disponibilita' %}" data-target="#risultati-query">Stato Occupazione Ombrellone</button>
        </div>

        <div class="navigazione-ritorno">
            <a href="{% url 'dashboard' %}" class="btn-dashboard">Torna alla Dashboard</a>
        </div>
    </aside>

    <section id="pannello-form" class="pannello-operativo">
        <div class="stato-vuoto">
            <p>Seleziona un'operazione dal menu "Servizi" per visualizzare l'interfaccia di inserimento.</p>
        </div>
    </section>

    <section id="risultati-query" class="pannello-risultati"></section>

</div>

<script src="{% static 'js/lateral-toggle.js' %}"></script>
{% endblock %}
