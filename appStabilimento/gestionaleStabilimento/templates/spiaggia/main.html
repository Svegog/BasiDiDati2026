{% extends "base.html" %}

{% block content %}
<div class="spiaggia-grid-container">
    
    <aside class="pannello-sinistro menu-laterale">
        <h2>Area Spiaggia</h2>
        
        <div class="gruppo-comandi">
            <h3>Servizi</h3>
            <button hx-get="{% url 'inserisci_cliente' %}" hx-target="#pannello-form">Inserimento Cliente</button>
            <button hx-get="{% url 'inserisci_prenotazione' %}" hx-target="#pannello-form">Prenotazione</button>
            <button hx-get="{% url 'inserisci_abbonamento' %}" hx-target="#pannello-form">Abbonamento</button>
            <button hx-get="{% url 'inserisci_noleggio' %}" hx-target="#pannello-form">Noleggio Lettino</button>
            <button hx-get="{% url 'modifica_tariffa_lettini' %}" hx-target="#pannello-form">Modifica Prezzo Lettini</button>
            <button hx-get="{% url 'modifica_prezzi_fila' %}" hx-target="#pannello-form">Modifica Prezzo File</button>
            <button hx-get="{% url 'conferma_pagamento_spiaggia' %}" hx-target="#pannello-form">Aggiorna Stato Pagamento</button>
        </div>
        
        <div class="gruppo-comandi">
            <h3>Controlli</h3>
            <button hx-get="{% url 'storico_cliente' %}" hx-target="#risultati-query">Storico Cliente</button>
            <button hx-get="{% url 'verifica_disponibilita' %}" hx-target="#risultati-query">Stato Occupazione Ombrellone</button>
        </div>
        
        <div class="navigazione-ritorno">
            <a href="{% url 'dashboard' %}" class="btn-link">Torna alla Dashboard</a>
        </div>
    </aside>

    <section id="pannello-form" class="pannello-operativo">
        <div class="stato-vuoto">
            <p>Seleziona un'operazione dal menu "Servizi" per visualizzare l'interfaccia di inserimento.</p>
        </div>
    </section>

    <section id="risultati-query" class="pannello-risultati">
        </section>

</div>
{% endblock %}
