<div class="form-panel">
    <h3>Nuovo Abbonamento Stagionale</h3>
    <form action="{% url 'inserisci_abbonamento' %}" method="POST">
        {% csrf_token %}
        <fieldset>
            <legend>Dati Cliente</legend>
            <input type="text" name="nome" placeholder="Nome" required>
            <input type="text" name="cognome" placeholder="Cognome" required>
            <input type="email" name="email" placeholder="Email" required>
        </fieldset>
        
        <fieldset>
            <legend>Dettagli Abbonamento</legend>
            <label>Codice Fila:</label>
            <input type="text" name="codfila" required>
            
            <label>Numero Ombrellone:</label>
            <input type="number" name="numombrellone" required>
            
            <label>Anno Stagione:</label>
            <input type="number" name="anno" value="2026" required>
            
            <label>Sconto Applicato (€):</label>
            <input type="number" step="0.01" name="sconto" value="0">
        </fieldset>
        <button type="submit" class="btn-primary">Registra Abbonamento</button>
    </form>
</div>
