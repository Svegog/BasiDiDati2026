<div class="risultato-panel">
    <h3>Disponibilità Trovata</h3>
    
    {% if ombrelloni %}
        <table class="table-risultati">
            <thead>
                <tr>
                    <th>Codice Fila</th>
                    <th>Numero Ombrellone</th>
                </tr>
            </thead>
            <tbody>
                {% for o in ombrelloni %}
                <tr>
                    <td><strong>{{ o.0 }}</strong></td>
                    <td>{{ o.1 }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="text-muted">Nessun ombrellone disponibile per le date selezionate.</p>
    {% endif %}
    
    <button onclick="document.getElementById('risultati-query').innerHTML=''" class="btn-chiudi mt-3">Chiudi Risultati</button>
</div>
