<div class="form-panel">
    <h3>Visualizza Storico Cliente</h3>
    <form hx-get="{% url 'storico_cliente' %}" hx-target="#risultati-query">
        <div class="form-group">
            <label>Nome:</label>
            <input type="text" name="nome" required>
        </div>
        <div class="form-group">
            <label>Cognome:</label>
            <input type="text" name="cognome" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" required>
        </div>
        <button type="submit" class="btn-info">Estrai Storico</button>
    </form>
</div>
{% include "partials/_toast_oob.html" %}
