<div class="form-panel">
    <h3>Modifica Tariffa Noleggio</h3>
    <form action="{% url 'modifica_tariffa_lettini' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Tipologia di Noleggio da modificare:</label>
            <select name="tiponoleggio" required>
                <option value="" disabled selected>-- Seleziona un opzione --</option>
                <option value='Mattina'>Mattina</option>
                <option value="Pomeriggio">Pomeriggio</option>
                <option value="Giornata">Giornata Completa</option>
            </select>
        </div>
        <div class="form-group">
            <label>Nuovo Prezzo (€):</label>
            <input type="number" step="0.01" name="prezzo" required>
        </div>
        <button type="submit" class="btn-warning">Aggiorna Tariffa</button>
    </form>
</div>
{% include "partials/_toast_oob.html" %}
