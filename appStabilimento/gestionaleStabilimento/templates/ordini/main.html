{% extends "base.html" %}

{% block content %}
<div class="ordini-grid-container">
    <aside class="pannello-sinistro">
        <h2>Area Ordini</h2>
        <div class="gruppo-comandi">
            <h3>Servizi</h3>
            <button hx-get="{% url 'inserisci_ordine' %}" hx-target="#pannello-form">Nuovo Ordine</button>
            <button hx-get="{% url 'aggiungi_fornitore' %}" hx-target="#pannello-form">Nuovo Fornitore</button>
            <button hx-get="{% url 'registra_consegna' %}" hx-target="#pannello-form">Registra Consegna</button>
            <button hx-get="{% url 'aggiorna_prezzo_catalogo' %}" hx-target="#pannello-form">Modifica Prezzi Catalogo</button>
            <button hx-get="{% url 'aggiorna_giacenze_inventario' %}" hx-target="#pannello-form">Rettifica Inventario</button>
        </div>
        <div class="gruppo-comandi">
            <h3>Controlli</h3>
            <button hx-get="{% url 'controllo_giacenze' %}" hx-target="#risultati-query">Prodotti Sotto Scorta</button>
        </div>
        <div class="navigazione-ritorno">
            <a href="{% url 'dashboard' %}">Torna alla Dashboard</a>
        </div>
    </aside>

    <section id="area-lavoro" class="pannello-operativo">
        <p>Seleziona un'operazione dal menu per iniziare.</p>
    </section>

    <section id="risultati-query" class="pannello-risultati"></section>
</div>
{% endblock %}
