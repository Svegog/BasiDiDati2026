<div class="risultato-panel">
    <h3>Catalogo Fornitore</h3>
    
    {% if prodotti %}
        <table class="table-risultati">
            <thead>
                <tr>
                    <th>Codice Prodotto</th>
                    <th>Prezzo Unitario</th>
                </tr>
            </thead>
            <tbody>
                {% for p in prodotti %}
                <tr>
                    <td><strong>{{ p.0 }}</strong></td>
                    <td>{{ p.1 }} €</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="text-muted">Nessun prodotto trovato nel catalogo per questa Partita IVA.</p>
    {% endif %}
    
    <button onclick="document.getElementById('risultati-query').innerHTML=''" class="btn-chiudi mt-3">Chiudi Risultati</button>
</div>
{% include "partials/_toast_oob.html" %}
