<div class="form-panel">
    <h3>Aggiungi Fornitore e Catalogo</h3>
    <form action="{% url 'aggiungi_fornitore' %}" method="POST">
        {% csrf_token %}
        <fieldset>
            <legend>Anagrafica Fornitore</legend>
            <input type="text" name="partitaiva" placeholder="Partita IVA" required>
            <input type="text" name="nome" placeholder="Ragione Sociale" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="indirizzo" placeholder="Indirizzo" required>
            <input type="text" name="telefono" placeholder="Telefono" required>
        </fieldset>
        <fieldset>
            <legend>Primo Prodotto a Catalogo</legend>
            <input type="text" name="codprodotto" placeholder="Codice Prodotto" required>
            <input type="number" step="0.01" name="prezzounitario" placeholder="Prezzo Unitario (€)" required>
        </fieldset>
        <button class="btn-dashboard" type="submit">Salva Fornitore</button>
    </form>
</div>
{% include "partials/_toast_oob.html" %}
