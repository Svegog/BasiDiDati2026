{% extends "base.html" %}

{% block content %}
<div class="login-container" style="max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    
    <h2 style="text-align: center; margin-bottom: 20px;">Accesso Proprietari</h2>
    
    <form action="{% url 'login' %}" method="POST">
        
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            <label for="email" style="display: block; margin-bottom: 5px;">Email:</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label for="password" style="display: block; margin-bottom: 5px;">Password:</label>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 8px;">
        </div>
        
        <button type="submit" style="width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Accedi al Gestionale
        </button>
    </form>
    
</div>
{% endblock %}
